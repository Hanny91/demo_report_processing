- id: damian-compass-trigger
  field: triggers
  date: "2026-08-07"
  report: |
    Damian was in good spirits at the start of the session but struggled when the group moved on to the map-reading exercise. He threw the compass down and said "this is stupid" when he got the bearing wrong twice. He calmed down after a 5 minute break away from the group and rejoined for the fire lighting activity, where he successfully got a sustained flame going and was keen to show the younger kids how he did it.
  expected_quotes:
    - 'He threw the compass down and said "this is stupid" when he got the bearing wrong twice.'

