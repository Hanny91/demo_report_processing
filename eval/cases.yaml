- id: jayden-transition-warning-boundary
  field: boundaries
  date: "2026-08-09"
  report: |
    The group moved into the woodland shelter for the afternoon activity, which involved several instructions given in quick succession. Jayden became visibly overwhelmed once the group leader started talking over the general noise of tool use. It helped when one instructor pulled him aside beforehand to say "in two minutes we are going to stop and move to the fire circle" rather than announcing the change to the whole group at once.
  expected_quotes:
    - 'It helped when one instructor pulled him aside beforehand to say "in two minutes we are going to stop and move to the fire circle" rather than announcing the change to the whole group at once.'

